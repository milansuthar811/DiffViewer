<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Tool - Side-by-side Text Comparison</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Diff Tool</h1>

  </header>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-group">
        <label for="left-input">Original</label>
        <textarea id="left-input" placeholder="Paste original text here..."></textarea>
      </div>
      <div class="toolbar-group">
        <label for="right-input">Modified</label>
        <textarea id="right-input" placeholder="Paste modified text here..."></textarea>
      </div>
    </div>

    <div class="options-panel">
      <details class="options-details">
        <summary>Advanced Options</summary>
        <div class="options-grid">
          <label class="option">
            <input type="checkbox" id="opt-trim-whitespace" checked>
            <span>Trim whitespace</span>
          </label>
          <label class="option">
            <input type="checkbox" id="opt-ignore-case">
            <span>Ignore case</span>
          </label>
          <label class="option">
            <input type="checkbox" id="opt-ignore-whitespace">
            <span>Ignore all whitespace</span>
          </label>
          <label class="option">
            <input type="checkbox" id="opt-word-diff" checked>
            <span>Word-level diff</span>
          </label>
          <label class="option">
            <input type="checkbox" id="opt-show-unchanged" checked>
            <span>Show unchanged</span>
          </label>
        </div>
      </details>
    </div>

    <div class="actions">
      <button id="btn-diff" class="btn primary">Compare</button>
      <button id="btn-share" class="btn secondary" disabled>Share Link</button>
      <button id="btn-clear" class="btn ghost">Clear</button>
      <button id="btn-swap" class="btn ghost" title="Swap left/right">⇄ Swap</button>
    </div>

    <div id="diff-output" class="diff-output hidden">
      <div class="diff-header">
        <div class="diff-col">
          <span class="diff-col-label">Original</span>
          <span id="left-stats" class="diff-stats"></span>
        </div>
        <div class="diff-col">
          <span class="diff-col-label">Modified</span>
          <span id="right-stats" class="diff-stats"></span>
        </div>
      </div>
      <div class="diff-container">
        <div class="diff-pane" id="left-pane"></div>
        <div class="diff-pane" id="right-pane"></div>
      </div>
    </div>

    <div id="loading" class="loading hidden">Computing diff...</div>
  </main>

  <footer class="footer">
    <a href="https://github.com" target="_blank" rel="noopener">Host on GitHub Pages</a>
    <span>•</span>
    <a href="#" id="link-source">View Source</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
